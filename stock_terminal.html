<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Terminal</title>
<style>
  /* ── tokens ── */
  :root {
    --bg:        #0a0e13;
    --surface:   #111720;
    --border:    #1e2a38;
    --border2:   #253040;
    --amber:     #f5a623;
    --amber-dim: #8a5d14;
    --green:     #00d68f;
    --red:       #ff4d6a;
    --blue:      #4d9fff;
    --muted:     #4a6070;
    --label:     #7a94a8;
    --text:      #c8dae8;
    --text-hi:   #e8f4ff;
    --mono:      'IBM Plex Mono', 'Courier New', monospace;
    --sans:      'IBM Plex Sans', system-ui, sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.4;
  }

  /* ── shell ── */
  .terminal {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    border: 1px solid var(--border);
    background: var(--bg);
  }

  /* ── top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .terminal-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--amber);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .market-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .badge-open  { background: #003d20; color: var(--green); border: 1px solid #00552c; }
  .badge-closed{ background: #3d0010; color: var(--red);   border: 1px solid #550016; }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 10px;
    color: var(--label);
  }
  .refresh-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    transition: background 0.3s;
  }
  .refresh-dot.active { background: var(--green); }

  /* ── grid layout ── */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: auto 1fr;
    gap: 0;
  }
  @media (max-width: 720px) {
    .main-grid { grid-template-columns: 1fr; }
    .news-col  { border-left: none; border-top: 1px solid var(--border); }
  }

  /* ── rankings panel ── */
  .rankings-col {
    grid-row: 1 / 3;
    overflow: hidden;
  }

  .section-header {
    padding: 7px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    color: var(--label);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  /* table */
  .rankings-table {
    width: 100%;
    border-collapse: collapse;
  }
  .rankings-table th {
    padding: 6px 10px;
    text-align: left;
    font-size: 9px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    white-space: nowrap;
  }
  .rankings-table th.right,
  .rankings-table td.right { text-align: right; }
  .rankings-table th.center,
  .rankings-table td.center { text-align: center; }

  .rankings-table tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .rankings-table tbody tr:hover { background: #131d28; }
  .rankings-table tbody tr.selected { background: #0d1e2e; }

  .rankings-table td {
    padding: 9px 10px;
    white-space: nowrap;
  }

  .rank-num {
    font-size: 10px;
    color: var(--muted);
    width: 22px;
    display: inline-block;
    text-align: right;
  }
  .ticker-sym {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-hi);
    margin-left: 6px;
  }

  .price-val { font-size: 13px; color: var(--text-hi); font-weight: 500; }
  .change-pos { color: var(--green); font-size: 11px; }
  .change-neg { color: var(--red);   font-size: 11px; }
  .change-neu { color: var(--muted); font-size: 11px; }

  /* score bars */
  .score-cell { min-width: 90px; }
  .score-bar-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .score-bar-bg {
    flex: 1;
    height: 4px;
    background: var(--border2);
    border-radius: 2px;
    overflow: hidden;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--amber);
    transition: width 0.6s ease;
  }
  .score-val {
    font-size: 11px;
    color: var(--label);
    width: 34px;
    text-align: right;
  }

  /* sparkline */
  .spark-cell { width: 80px; }
  .spark svg { display: block; }

  /* signal pill */
  .signal {
    font-size: 9px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 2px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .sig-strong { background: #003d20; color: var(--green); }
  .sig-mod    { background: #2a3800; color: #b8d430;      }
  .sig-weak   { background: #3d2800; color: #f5a623;      }
  .sig-low    { background: #1a0a0a; color: #884455;      }

  /* ── news column ── */
  .news-col {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .news-scroll {
    overflow-y: auto;
    flex: 1;
    max-height: 520px;
  }
  .news-scroll::-webkit-scrollbar { width: 4px; }
  .news-scroll::-webkit-scrollbar-track { background: var(--bg); }
  .news-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .news-item {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .news-item:hover { background: #131d28; }

  .news-ticker {
    font-size: 9px;
    font-weight: 600;
    color: var(--amber);
    letter-spacing: 0.1em;
    margin-bottom: 3px;
  }
  .news-headline {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--text);
    line-height: 1.45;
    margin-bottom: 4px;
  }
  .news-sentiment {
    font-size: 9px;
    color: var(--muted);
  }
  .sent-pos { color: var(--green); }
  .sent-neg { color: var(--red); }
  .sent-neu { color: var(--muted); }

  /* ── detail strip (below rankings, above news fold) ── */
  .detail-strip {
    grid-column: 1;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 10px 14px;
    min-height: 52px;
    font-size: 11px;
    color: var(--label);
  }
  .detail-strip .detail-ticker {
    font-size: 13px;
    font-weight: 600;
    color: var(--amber);
    margin-right: 10px;
  }
  .stat-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .stat-item label {
    color: var(--muted);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: block;
  }
  .stat-item span {
    font-size: 12px;
    color: var(--text-hi);
  }

  /* ── loading / error ── */
  .state-msg {
    padding: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  .blink { animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── bottom bar ── */
  .bottombar {
    padding: 5px 14px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 9px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="terminal" id="terminal">

  <!-- top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="terminal-title">MKTRANK</span>
      <span class="market-badge" id="mktBadge">—</span>
    </div>
    <div class="topbar-right">
      <span id="lastUpdated">—</span>
      <span><span class="refresh-dot" id="dot"></span> LIVE</span>
    </div>
  </div>

  <!-- loading state -->
  <div class="state-msg" id="loadMsg">
    <span class="blink">█</span> FETCHING DATA...
  </div>

  <!-- main content (hidden until loaded) -->
  <div class="main-grid" id="mainGrid" style="display:none">

    <!-- left: rankings -->
    <div class="rankings-col">
      <div class="section-header">
        <span>DAILY RANKINGS — NEXT-DAY PREDICTION</span>
        <span>70% ML · 30% SENTIMENT</span>
      </div>
      <table class="rankings-table">
        <thead>
          <tr>
            <th>#&nbsp;&nbsp;TICKER</th>
            <th class="right">PRICE</th>
            <th class="right">CHG</th>
            <th class="center">SPARK</th>
            <th>SCORE</th>
            <th>P(UP)</th>
            <th>SENT</th>
            <th class="center">SIG</th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>

      <!-- detail strip -->
      <div class="detail-strip" id="detailStrip">
        <span style="color:var(--muted);font-size:11px">← Select a row for details</span>
      </div>
    </div>

    <!-- right: news -->
    <div class="news-col">
      <div class="section-header">
        <span>HEADLINES</span>
      </div>
      <div class="news-scroll" id="newsScroll">
        <div class="state-msg" style="padding:20px">No headlines loaded</div>
      </div>
    </div>

  </div>

  <div class="bottombar">
    <span>AAPL · MSFT · AMZN · TSLA · NVDA · META · GOOGL</span>
    <span>ACADEMIC USE ONLY — NOT FINANCIAL ADVICE</span>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
// Point this at your raw GitHub file after you create the repo
const DATA_URL = 'https://raw.githubusercontent.com/Vib01/stock-pipeline/master/ranking.json';
const REFRESH_MS = 30 * 60 * 1000; // 30 min

// ── STATE ─────────────────────────────────────────────────────────────────────
let data = null;
let selectedTicker = null;

// ── SPARKLINE ─────────────────────────────────────────────────────────────────
function sparkline(prices, w = 80, h = 28) {
  if (!prices || prices.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const range = max - min || 1;
  const xs = prices.map((_, i) => (i / (prices.length - 1)) * w);
  const ys = prices.map(p => h - ((p - min) / range) * (h - 4) - 2);
  const path = xs.map((x, i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const last = prices[prices.length - 1];
  const first = prices[0];
  const color = last >= first ? '#00d68f' : '#ff4d6a';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`;
}

// ── SIGNAL ────────────────────────────────────────────────────────────────────
function signal(score) {
  if (score >= 0.70) return ['STRONG', 'sig-strong'];
  if (score >= 0.58) return ['MOD',    'sig-mod'];
  if (score >= 0.48) return ['WEAK',   'sig-weak'];
  return ['LOW', 'sig-low'];
}

// ── FORMAT ────────────────────────────────────────────────────────────────────
function fmtPct(v)   { return (v * 100).toFixed(1) + '%'; }
function fmtScore(v) { return v.toFixed(3); }
function fmtChg(v) {
  const cls = v > 0 ? 'change-pos' : v < 0 ? 'change-neg' : 'change-neu';
  const sign = v > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${v.toFixed(2)}%</span>`;
}
function sentClass(s) {
  if (s > 0.1)  return 'sent-pos';
  if (s < -0.1) return 'sent-neg';
  return 'sent-neu';
}
function sentLabel(s) {
  if (s > 0.3)  return '▲ POS';
  if (s < -0.3) return '▼ NEG';
  return '– NEU';
}

// ── RENDER RANKINGS ───────────────────────────────────────────────────────────
function renderRankings(rankings) {
  const tbody = document.getElementById('rankBody');
  tbody.innerHTML = '';

  rankings.forEach(r => {
    const [sigLabel, sigCls] = signal(r.final_score);
    const rawSent = (r.sentiment_norm - 0.5) * 2; // map 0-1 → -1 to 1

    const tr = document.createElement('tr');
    if (r.ticker === selectedTicker) tr.classList.add('selected');

    tr.innerHTML = `
      <td>
        <span class="rank-num">${r.rank}</span>
        <span class="ticker-sym">${r.ticker}</span>
      </td>
      <td class="right"><span class="price-val">$${r.price.toFixed(2)}</span></td>
      <td class="right">${fmtChg(r.change_pct)}</td>
      <td class="center spark">${sparkline(r.sparkline)}</td>
      <td class="score-cell">
        <div class="score-bar-wrap">
          <div class="score-bar-bg">
            <div class="score-bar-fill" style="width:${(r.final_score * 100).toFixed(1)}%"></div>
          </div>
          <span class="score-val">${fmtScore(r.final_score)}</span>
        </div>
      </td>
      <td>${fmtPct(r.prob_up)}</td>
      <td><span class="${sentClass(rawSent)}">${sentLabel(rawSent)}</span></td>
      <td class="center"><span class="signal ${sigCls}">${sigLabel}</span></td>
    `;

    tr.addEventListener('click', () => selectTicker(r.ticker));
    tbody.appendChild(tr);
  });
}

// ── DETAIL STRIP ──────────────────────────────────────────────────────────────
function renderDetail(r) {
  const rawSent = (r.sentiment_norm - 0.5) * 2;
  document.getElementById('detailStrip').innerHTML = `
    <div>
      <span class="detail-ticker">${r.ticker}</span>
      <span style="color:var(--label);font-size:10px">RANK #${r.rank}</span>
    </div>
    <div class="stat-row">
      <div class="stat-item"><label>Final Score</label><span>${fmtScore(r.final_score)}</span></div>
      <div class="stat-item"><label>P(Up tmrw)</label><span>${fmtPct(r.prob_up)}</span></div>
      <div class="stat-item"><label>Sentiment</label><span class="${sentClass(rawSent)}">${fmtPct(r.sentiment_norm)}</span></div>
      <div class="stat-item"><label>Price</label><span>$${r.price.toFixed(2)}</span></div>
      <div class="stat-item"><label>Chg</label><span>${r.change_pct > 0 ? '+' : ''}${r.change_pct.toFixed(2)}%</span></div>
    </div>
  `;
}

// ── NEWS ──────────────────────────────────────────────────────────────────────
function renderNews(rankings) {
  const container = document.getElementById('newsScroll');
  const allHeadlines = [];

  rankings.forEach(r => {
    (r.headlines || []).forEach(h => {
      allHeadlines.push({ ticker: r.ticker, ...h });
    });
  });

  if (!allHeadlines.length) {
    container.innerHTML = '<div class="state-msg" style="padding:20px;font-size:11px">No headlines available</div>';
    return;
  }

  container.innerHTML = allHeadlines.map(h => {
    const sc = typeof h.score === 'number' ? h.score : 0;
    const cls = sc > 0.05 ? 'sent-pos' : sc < -0.05 ? 'sent-neg' : 'sent-neu';
    return `
      <div class="news-item" onclick="window.open('${h.url || '#'}','_blank')">
        <div class="news-ticker">${h.ticker}</div>
        <div class="news-headline">${h.title}</div>
        <div class="news-sentiment"><span class="${cls}">${sc > 0 ? '+' : ''}${sc.toFixed(3)}</span> VADER</div>
      </div>
    `;
  }).join('');
}

// ── SELECT ────────────────────────────────────────────────────────────────────
function selectTicker(ticker) {
  selectedTicker = ticker;
  const r = data.rankings.find(x => x.ticker === ticker);
  if (r) {
    renderDetail(r);
    renderRankings(data.rankings);   // re-render to update selection highlight
  }
}

// ── FETCH + RENDER ────────────────────────────────────────────────────────────
async function fetchData() {
  const dot = document.getElementById('dot');
  dot.classList.add('active');

  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();

    // header
    const badge = document.getElementById('mktBadge');
    badge.textContent = data.market_status.toUpperCase();
    badge.className = 'market-badge ' + (data.market_status === 'open' ? 'badge-open' : 'badge-closed');

    const ts = new Date(data.last_updated);
    document.getElementById('lastUpdated').textContent =
      ts.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
      ts.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

    renderRankings(data.rankings);
    renderNews(data.rankings);
    if (!selectedTicker && data.rankings.length) {
      selectTicker(data.rankings[0].ticker);
    }

    document.getElementById('loadMsg').style.display = 'none';
    document.getElementById('mainGrid').style.display = 'grid';
  } catch (e) {
    document.getElementById('loadMsg').innerHTML =
      `<span style="color:var(--red)">✗ FAILED TO LOAD DATA</span><br>
       <span style="font-size:10px;color:var(--muted)">${e.message}</span>`;
  } finally {
    setTimeout(() => dot.classList.remove('active'), 800);
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
fetchData();
setInterval(fetchData, REFRESH_MS);
</script>
</body>
</html>
